<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestiveFighter</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #170d2b;
        }

        #game {
            position: relative;
            flex: none;
            width: min(calc(100vw - 20px), calc((100vh - 20px) * 16 / 9));
            width: min(calc(100vw - 20px), calc((100dvh - 20px) * 16 / 9));
            aspect-ratio: 16 / 9;
        }

        #game canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>



    <div id="game"></div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
